services:
  # 1. PostgreSQL Veritabanı
  db:
    image: postgres:16-alpine
    container_name: kutuphane-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kutuphane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kutuphane123!}
      POSTGRES_DB: ${POSTGRES_DB:-kutuphane}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kutuphane-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kutuphane} -d ${POSTGRES_DB:-kutuphane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kutuphane-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kutuphane}:${POSTGRES_PASSWORD:-kutuphane123!}@db:5432/${POSTGRES_DB:-kutuphane}
      SECRET_KEY: ${SECRET_KEY:-guvenli-gelistirme-anahtari-en-az-32-karakter-uzunlugundadir}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOAN_PERIOD_DAYS: ${LOAN_PERIOD_DAYS:-14}
      MAX_ACTIVE_LOANS: ${MAX_ACTIVE_LOANS:-3}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin12345!}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-Ogrenci12345!}
    ports:
      - "8000:8000"
    networks:
      - kutuphane-network

  # 3. React Frontend Web Arayüzü (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kutuphane-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - kutuphane-network

volumes:
  postgres_data:
    driver: local

networks:
  kutuphane-network:
    driver: bridge
